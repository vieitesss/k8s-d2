apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: payments
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-api
      tier: backend
  template:
    metadata:
      labels:
        app: payments-api
        tier: backend
    spec:
      containers:
      - name: api
        image: busybox:latest
        command: ['sh', '-c', 'while true; do sleep 3600; done']
        ports:
        - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-worker
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-worker
      component: worker
  template:
    metadata:
      labels:
        app: payments-worker
        component: worker
    spec:
      containers:
      - name: worker
        image: busybox:latest
        command: ['sh', '-c', 'while true; do sleep 3600; done']
        volumeMounts:
        - name: queue-data
          mountPath: /var/lib/worker
      volumes:
      - name: queue-data
        persistentVolumeClaim:
          claimName: queue-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
      component: ui
  template:
    metadata:
      labels:
        app: grafana
        component: ui
    spec:
      containers:
      - name: grafana
        image: busybox:latest
        command: ['sh', '-c', 'while true; do sleep 3600; done']
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
      volumes:
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: grafana-storage
