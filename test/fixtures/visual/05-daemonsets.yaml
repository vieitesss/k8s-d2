apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: observability
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      containers:
      - name: exporter
        image: registry.k8s.io/pause:3.10
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9100
