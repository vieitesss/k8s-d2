apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: observability
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      containers:
      - name: exporter
        image: busybox:latest
        command: ['sh', '-c', 'while true; do sleep 3600; done']
        ports:
        - containerPort: 9100
