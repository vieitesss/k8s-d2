apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-config
  namespace: payments
data:
  FEATURE_FLAGS: fraud-checks,async-settlement
  LOG_LEVEL: info
---
apiVersion: v1
kind: Secret
metadata:
  name: payments-secrets
  namespace: payments
type: Opaque
stringData:
  gateway-api-key: sandbox-key
  webhook-secret: sandbox-webhook
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus:9090
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: observability
type: Opaque
stringData:
  admin-user: admin
  admin-password: admin123
